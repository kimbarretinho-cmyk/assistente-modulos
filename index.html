<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente Pessoal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--fg:#111;--fg2:#666;--bd:#ddd;--hov:#f5f5f5}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#eee;--fg2:#999;--bd:#333;--hov:#1a1a1a}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:700px;margin:0 auto}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.M{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:12px}
.m{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;color:var(--fg2);background:transparent}
.m:hover{background:var(--hov);color:var(--fg)}
.m.a{background:var(--fg);color:var(--bg)}
.S{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.s{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;color:var(--fg2);background:transparent}
.s:hover{background:var(--hov);color:var(--fg)}
.s.a{background:var(--hov);color:var(--fg)}
.C{border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.T{font-size:16px;font-weight:500;margin-bottom:10px}
.I{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:transparent;color:inherit;margin-bottom:8px;outline:none}
.I:focus{border-color:var(--fg)}
.B{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;background:var(--fg);color:var(--bg)}
.B:hover{opacity:.85}
.B2{background:var(--hov);color:var(--fg)}
.Bs{padding:6px 12px;font-size:12px}
.t{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;font-size:12px;background:var(--hov);color:var(--fg2);margin:2px}
.E{text-align:center;padding:40px 20px;color:var(--fg2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.Sb{text-align:center;padding:14px;border:1px solid var(--bd);border-radius:10px}
.Sv{font-size:24px;font-weight:500}
.Sl{font-size:12px;color:var(--fg2);margin-top:4px}
.Pb{height:8px;border-radius:4px;background:var(--hov);overflow:hidden;margin-top:6px}
.Pf{height:100%;border-radius:4px;background:var(--fg);transition:width .3s}
.ra{opacity:0;transition:opacity .15s}
.C:hover .ra{opacity:1}
.db{color:#e74c3c;font-size:12px;padding:4px 8px;border-radius:6px}
.db:hover{background:rgba(231,76,60,.1)}
.op{padding:12px 16px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:border-color .15s}
.op:hover{border-color:var(--fg)}
.op.cr{border-color:#27ae60;background:rgba(39,174,96,.08)}
.op.wr{border-color:#e74c3c;background:rgba(231,76,60,.08)}
.fc{perspective:800px;cursor:pointer}
.fci{position:relative;width:100%;min-height:140px;transition:transform .5s;transform-style:preserve-3d;border-radius:12px;border:1px solid var(--bd)}
.fc.fl .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;width:100%;min-height:140px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:24px;font-size:16px;font-weight:500;text-align:center;border-radius:12px}
.fcb{transform:rotateY(180deg);background:var(--hov)}
.td{font-size:48px;font-weight:500;text-align:center;margin:16px 0;font-variant-numeric:tabular-nums}
.kc{border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:160px}
.kch{font-size:13px;font-weight:500;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.kca{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;font-size:12px;position:relative}
.kca:hover{border-color:var(--fg)}
.hr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.hr:last-child{border-bottom:none}
.hc{width:22px;height:22px;border-radius:5px;border:2px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center}
.hc.ck{background:var(--fg);border-color:var(--fg)}
.mbt{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent}
.mbt:hover{border-color:var(--fg)}
.mbt.s{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ec{padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
.ed{font-size:11px;color:var(--fg2);margin-bottom:2px}
.et{font-size:13px;line-height:1.5}
.wc{width:120px;height:120px;border-radius:50%;border:3px solid var(--bd);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
.wf{position:absolute;bottom:0;left:0;right:0;background:#3498db;opacity:.25;transition:height .5s}
.wt{position:relative;z-index:1;font-size:28px;font-weight:500}
.wl{position:relative;z-index:1;font-size:11px;color:var(--fg2)}
.dd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border:1px solid var(--bd)}
.dd.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mc{width:18px;height:18px;border-radius:4px;border:2px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mc.ck{background:var(--fg);border-color:var(--fg)}
.rb{padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--hov);text-align:center}
.rv{font-size:22px;font-weight:500}
.rl{font-size:11px;color:var(--fg2);margin-top:2px}
.df{padding:8px 14px;border-radius:8px;font-size:12px;border:1px solid var(--bd);background:transparent}
.df:hover{background:var(--hov)}
.df.s{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sm{padding:10px 14px;border-radius:10px;margin-bottom:8px;border:1px solid var(--bd);font-size:13px}
.smh{display:flex;justify-content:space-between;font-size:11px;color:var(--fg2);margin-bottom:4px}
.bc{width:50px;height:70px;border-radius:5px;background:var(--fg);display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:9px;font-weight:500;text-align:center;padding:3px}
.su{padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--hov);font-size:13px;line-height:1.6;white-space:pre-wrap}
.sr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px}
.sr:last-child{border-bottom:none}
@media(max-width:480px){.g2,.g3{grid-template-columns:1fr}.td{font-size:36px}.M{padding:8px 4px}.m{padding:8px 12px;font-size:12px}}
</style>
<base target="_blank">
</head>
<body>
<div id="app">
<div class="M" id="Mn">
  <button class="m a" data-m="wa" onclick="SM('wa')">💬 WhatsApp</button>
  <button class="m" data-m="est" onclick="SM('est')">📚 Estudos</button>
  <button class="m" data-m="sau" onclick="SM('sau')">🍎 Saúde</button>
  <button class="m" data-m="pro" onclick="SM('pro')">⚡ Produtividade</button>
</div>
<div id="Ct"></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id),Ct=$('Ct');
let M='wa',S={wa:'tm',est:'fl',sau:'ag',pro:'po'};
let D={wa:{t:[],c:[],sc:[],h:[]},est:{d:[],q:[],b:[],su:[]},sau:{w:{g:2000,t:0,h:[]},i:null,m:[],sl:[]},pro:{p:{ss:[]},k:{t:[],d:[],dn:[]},hb:[],di:[]}};
function L(){try{D.wa=JSON.parse(localStorage.getItem('ma_wa_data')||'null')||D.wa;D.est=JSON.parse(localStorage.getItem('ma_est_data')||'null')||D.est;D.sau=JSON.parse(localStorage.getItem('ma_sau_data')||'null')||D.sau;D.pro=JSON.parse(localStorage.getItem('ma_pro_data')||'null')||D.pro}catch(e){}}
function SV(){localStorage.setItem('ma_wa_data',JSON.stringify(D.wa));localStorage.setItem('ma_est_data',JSON.stringify(D.est));localStorage.setItem('ma_sau_data',JSON.stringify(D.sau));localStorage.setItem('ma_pro_data',JSON.stringify(D.pro))}
L();
const E=t=>(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FT=s=>{const m=Math.floor(s/60),sc=s%60;return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')};
const WKD=()=>{const d=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push({date:x.toISOString().split('T')[0],lb:x.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')})}return d};

function SM(m){M=m;document.querySelectorAll('.m').forEach(b=>b.classList.remove('a'));document.querySelector('[data-m="'+m+'"]').classList.add('a');if(M==='wa')RWA();else if(M==='est')RES();else if(M==='sau')RSA();else RPR()}

/* WHATSAPP */
function RWA(){let h='<div class="S">';['tm','ct','sc','hi'].forEach(x=>h+='<button class="s '+(S.wa===x?'a':'')+'" onclick="SS('wa',''+x+'')">'+{tm:'Templates',ct:'Contatos',sc:'Agendador',hi:'Histórico'}[x]+'</button>');h+='</div>';
if(S.wa==='tm'){h+='<div class="C"><div class="T">Novo template</div><input class="I" id="wt-n" placeholder="Nome"><textarea class="I" id="wt-b" rows="3" placeholder="Mensagem" style="resize:vertical"></textarea><input class="I" id="wt-tg" placeholder="Tags"><button class="B Bs" onclick="WAT()">Salvar</button></div>';
if(!D.wa.t.length)h+='<div class="E">Nenhum template ainda.</div>';
else D.wa.t.forEach((t,i)=>{h+='<div class="C"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-weight:500;font-size:14px">'+E(t.n)+'</div><div style="font-size:12px;color:var(--fg2);margin-top:2px">'+E(t.b)+'</div></div><div class="ra"><button class="db" onclick="WDT('+i+')">×</button></div></div></div>'})}
else if(S.wa==='ct'){h+='<div class="C"><div class="T">Novo contato</div><input class="I" id="wc-n" placeholder="Nome"><input class="I" id="wc-p" placeholder="Telefone"><input class="I" id="wc-g" placeholder="Grupo"><button class="B Bs" onclick="WAC()">Adicionar</button></div>';
if(!D.wa.c.length)h+='<div class="E">Nenhum contato.</div>';
else{const gs=[...new Set(D.wa.c.map(c=>c.g||'Sem grupo'))];gs.forEach(g=>{h+='<div class="C"><div class="T">'+E(g)+'</div>';D.wa.c.filter(c=>(c.g||'Sem grupo')===g).forEach(c=>{const gi=D.wa.c.indexOf(c);h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><div><div style="font-size:13px;font-weight:500">'+E(c.n)+'</div><div style="font-size:11px;color:var(--fg2)">'+E(c.p)+'</div></div><div class="ra"><button class="db" onclick="WDC('+gi+')">×</button></div></div>'});h+='</div>'})}}
else if(S.wa==='sc'){h+='<div class="C"><div class="T">Agendar mensagem</div><select class="I" id="ws-t"><option value="">Template</option>';D.wa.t.forEach((t,i)=>h+='<option value="'+i+'">'+E(t.n)+'</option>');h+='</select><select class="I" id="ws-c"><option value="">Contato</option>';D.wa.c.forEach((c,i)=>h+='<option value="'+i+'">'+E(c.n)+'</option>');h+='</select><input class="I" type="datetime-local" id="ws-d"><button class="B Bs" onclick="WAS()">Agendar</button></div>';
if(!D.wa.sc.length)h+='<div class="E">Nenhuma mensagem agendada.</div>';
else{D.wa.sc.forEach((s,i)=>h+='<div class="C"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px">'+E(s.t)+' → '+E(s.c)+' <span class="t">'+E(s.d)+'</span></div><div class="ra"><button class="db" onclick="WDS('+i+')">×</button></div></div></div>')}}
else{h+='<div class="g2" style="margin-bottom:14px"><div class="Sb"><div class="Sv">'+D.wa.h.length+'</div><div class="Sl">Mensagens</div></div><div class="Sb"><div class="Sv">'+D.wa.c.length+'</div><div class="Sl">Contatos</div></div></div>';
if(!D.wa.h.length)h+='<div class="E">Nenhuma mensagem.</div>';
else D.wa.h.slice().reverse().forEach(m=>h+='<div class="sm"><div class="smh"><span>'+E(m.c)+'</span><span>'+m.d+'</span></div>'+E(m.x)+'</div>')}
Ct.innerHTML=h}
window.SS=function(m,s){S[m]=s;if(m==='wa')RWA();else if(m==='est')RES();else if(m==='sau')RSA();else RPR()}
window.WAT=function(){const n=$('wt-n').value.trim(),b=$('wt-b').value.trim(),tg=$('wt-tg').value;if(!n||!b)return;D.wa.t.push({n,b,tg});SV();RWA()}
window.WDT=function(i){D.wa.t.splice(i,1);SV();RWA()}
window.WAC=function(){const n=$('wc-n').value.trim(),p=$('wc-p').value.trim(),g=$('wc-g').value.trim();if(!n||!p)return;D.wa.c.push({n,p,g});SV();RWA()}
window.WDC=function(i){D.wa.c.splice(i,1);SV();RWA()}
window.WAS=function(){const ti=parseInt($('ws-t').value),ci=parseInt($('ws-c').value),d=$('ws-d').value;if(isNaN(ti)||isNaN(ci)||!d)return;D.wa.sc.push({t:D.wa.t[ti].n,c:D.wa.c[ci].n,d});SV();RWA()}
window.WDS=function(i){D.wa.sc.splice(i,1);SV();RWA()}

/* ESTUDOS */
let ES={dk:-1,cd:0,fl:false},EQ={ix:0,sc:0,an:false,sl:null},EA=null,EST='topics';
function RES(){let h='<div class="S">';['fl','si','le','su'].forEach(x=>h+='<button class="s '+(S.est===x?'a':'')+'" onclick="SS('est',''+x+'')">'+{fl:'Flashcards',si:'Simulados',le:'Leitura',su:'Resumos'}[x]+'</button>');h+='</div>';
if(S.est==='fl'){if(ES.dk>=0){const dk=D.est.d[ES.dk],cd=dk.c[ES.cd];if(!cd){ES={dk:-1,cd:0,fl:false};return RES()}
h+='<div style="margin-bottom:12px"><button class="B2 Bs" onclick="EBD()">← Voltar</button></div>';
h+='<div style="text-align:center;margin-bottom:14px"><span class="t">'+E(dk.n)+'</span><span class="t">'+(ES.cd+1)+'/'+dk.c.length+'</span></div>';
h+='<div class="fc '+(ES.fl?'fl':'')+'" onclick="EFL()"><div class="fci"><div class="fcf">'+E(cd.f)+'</div><div class="fcb">'+E(cd.b)+'</div></div></div>';
if(ES.fl)h+='<div style="display:flex;justify-content:center;gap:10px;margin-top:14px"><button class="df" onclick="ERT(1)">Difícil</button><button class="df" onclick="ERT(2)">Médio</button><button class="df" onclick="ERT(3)">Fácil</button></div>';
else h+='<div style="text-align:center;margin-top:14px;color:var(--fg2);font-size:12px">Toque para virar</div>'}
else{h+='<div class="g2" style="margin-bottom:14px"><div class="Sb"><div class="Sv">'+D.est.d.length+'</div><div class="Sl">Baralhos</div></div><div class="Sb"><div class="Sv">'+D.est.d.reduce((a,d)=>a+d.c.length,0)+'</div><div class="Sl">Cartões</div></div></div>';
h+='<div class="C"><div class="T">Novo baralho</div><input class="I" id="ed-n" placeholder="Nome"><button class="B Bs" onclick="ECD()">Criar</button></div>';
if(!D.est.d.length)h+='<div class="E">Nenhum baralho.</div>';
else D.est.d.forEach((d,i)=>{h+='<div class="C"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:500">'+E(d.n)+'</div><div style="font-size:12px;color:var(--fg2)">'+d.c.length+' cartões</div></div><div style="display:flex;gap:6px"><button class="B Bs" onclick="ESTU('+i+')">Estudar</button><div class="ra"><button class="db" onclick="EDD('+i+')">×</button></div></div></div>';
h+='<div style="margin-top:10px;display:flex;gap:6px"><input class="I" id="ef-'+i+'" placeholder="Frente" style="flex:1;margin-bottom:0"><input class="I" id="eb-'+i+'" placeholder="Verso" style="flex:1;margin-bottom:0"><button class="B2 Bs" onclick="EAC('+i+')">+</button></div></div>'})}}
if(S.est==='si'){if(EQ.an&&D.est.q.length){const q=D.est.q[EQ.ix];h+='<div class="C"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span class="t">'+q.cat+'</span><span class="t">'+(EQ.ix+1)+'/'+D.est.q.length+'</span></div><div class="T" style="margin-bottom:14px">'+E(q.t)+'</div>';
q.o.forEach((opt,oi)=>{let cl='op';if(oi===q.c)cl+=' cr';else if(oi===EQ.sl)cl+=' wr';h+='<div class="'+cl+'">'+String.fromCharCode(65+oi)+') '+E(opt)+'</div>'});
h+='<div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px">Pontuação: <strong>'+EQ.sc+'</strong>/'+D.est.q.length+'</div>'+(EQ.ix<D.est.q.length-1?'<button class="B Bs" onclick="ENQ()">Próxima →</button>':'<button class="B Bs" onclick="EFQ()">Finalizar</button>')+'</div></div>'}
else if(EQ.ix<D.est.q.length&&D.est.q.length){const q=D.est.q[EQ.ix];h+='<div class="C"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span class="t">'+q.cat+'</span><span class="t">'+(EQ.ix+1)+'/'+D.est.q.length+'</span></div><div class="T" style="margin-bottom:14px">'+E(q.t)+'</div>';q.o.forEach((opt,oi)=>h+='<div class="op" onclick="EAN('+oi+')">'+String.fromCharCode(65+oi)+') '+E(opt)+'</div>');h+='<div style="margin-top:14px;font-size:13px">Pontuação: <strong>'+EQ.sc+'</strong></div></div>'}
else{h+='<div class="g2" style="margin-bottom:14px"><div class="Sb"><div class="Sv">'+D.est.q.length+'</div><div class="Sl">Questões</div></div><div class="Sb"><div class="Sv">'+[...new Set(D.est.q.map(q=>q.cat))].length+'</div><div class="Sl">Categorias</div></div></div>';
h+='<div class="C"><div class="T">Nova questão</div><input class="I" id="eq-t" placeholder="Enunciado"><input class="I" id="eq-c" placeholder="Categoria">';
for(let i=1;i<=4;i++)h+='<input class="I" id="eq-o'+i+'" placeholder="Opção '+String.fromCharCode(64+i)+'">';
h+='<div style="display:flex;gap:6px;margin-bottom:10px">';for(let i=0;i<4;i++)h+='<button class="df" id="eq-a'+i+'" onclick="ESA('+i+')">'+String.fromCharCode(65+i)+'</button>';h+='</div><button class="B Bs" onclick="EAQ()">Adicionar</button></div>';
if(D.est.q.length){h+='<div style="display:flex;gap:8px;margin-bottom:10px"><button class="B Bs" onclick="ESQ()">Iniciar</button><button class="B2 Bs" onclick="ECQ()">Limpar</button></div>';
D.est.q.forEach((q,i)=>h+='<div class="C"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><span class="t">'+q.cat+'</span><div style="margin-top:4px;font-size:13px">'+E(q.t)+'</div></div><div class="ra"><button class="db" onclick="EDQ('+i+')">×</button></div></div></div>')}
else h+='<div class="E">Nenhuma questão cadastrada.</div>'}}
if(S.est==='le'){h+='<div class="g3" style="margin-bottom:14px"><div class="Sb"><div class="Sv">'+D.est.b.length+'</div><div class="Sl">Livros</div></div><div class="Sb"><div class="Sv">'+D.est.b.reduce((a,b)=>a+(b.cur||0),0)+'</div><div class="Sl">Págs lidas</div></div><div class="Sb"><div class="Sv">'+D.est.b.reduce((a,b)=>a+(b.g||0),0)+'</div><div class="Sl">Meta total</div></div></div>';
h+='<div class="C"><div class="T">Novo livro</div><input class="I" id="el-t" placeholder="Título"><div class="g2"><input class="I" id="el-to" type="number" placeholder="Total páginas"><input class="I" id="el-g" type="number" placeholder="Meta diária"></div><button class="B Bs" onclick="EAL()">Adicionar</button></div>';
if(!D.est.b.length)h+='<div class="E">Nenhum livro.</div>';
else D.est.b.forEach((b,i)=>{const pc=b.to>0?Math.round((b.cur/b.to)*100):0;h+='<div class="C"><div style="display:flex;gap:12px;align-items:flex-start"><div class="bc">'+E(b.t.substring(0,10))+'</div><div style="flex:1"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:500">'+E(b.t)+'</div><div class="ra"><button class="db" onclick="EDL('+i+')">×</button></div></div><div style="font-size:12px;color:var(--fg2);margin-bottom:6px">'+b.cur+'/'+b.to+' pags · Meta: '+b.g+'/dia</div><div class="Pb"><div class="Pf" style="width:'+pc+'%"></div></div><div style="font-size:11px;color:var(--fg2);margin-top:3px">'+pc+'%</div><div style="margin-top:10px;display:flex;gap:6px"><input class="I" type="number" id="elp-'+i+'" placeholder="Págs hoje" style="flex:1;margin-bottom:0"><button class="B2 Bs" onclick="EUL('+i+')">Atualizar</button></div></div></div></div>'})}
